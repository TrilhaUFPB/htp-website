name: Keep Supabase warm

on:
  schedule:
    # Supabase pauses Free projects with "too few user queries" over a week,
    # not after 7 days of zero activity; it recommends a few requests a day.
    # Every 6h gives 4/day, so a single failed run no longer leaves a gap.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keep-warm endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.hackthepath.com.br/api/cron/keep-warm")

          echo "HTTP status: $status"
          cat /tmp/response.json

          if [ "$status" != "200" ]; then
            echo "Keep-warm request failed."
            exit 1
          fi
